apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordersservice-deployment
  labels:
    app: ordersservice
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ordersservice
  template:
    metadata:
      labels:
        app: ordersservice
    spec:
      containers:
        - name: ordersservice
          image: hardingtrutran/ordersservice:546c572
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          #   initialDelaySeconds: 30 # give the JVM/Spring context time to boot before checking
          #   periodSeconds: 10
          #   timeoutSeconds: 3
          #   failureThreshold: 3 # 3 consecutive failures = pod killed and restarted
          #   successThreshold: 1
          ports:
            - containerPort: 8082
            
          envFrom:
            - configMapRef:
                name: postgres-cm
            - configMapRef:
                name: axon-cm
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_PASSWORD

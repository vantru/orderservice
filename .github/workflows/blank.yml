
name: CI

on:
  
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Render settings.xml
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: envsubst < .github/ci/settings.xml.template > settings.xml

      - name: Validate XML
        run: |
          sudo apt-get install -y libxml2-utils
          xmllint --noout settings.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: docker build image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          secrets: |
            maven_settings=settings.xml
          push: false
          tags: hardingtrutran/ordersservice:${{ steps.sha.outputs.short_sha }}
      - name: Clean up rendered secret file
        if: always()
        run: rm -f settings.xml
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: trivy image scans
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hardingtrutran/ordersservice:${{ needs.build.outputs.short_sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
  push-to-dockerhub:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: docker push image to docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: hardingtrutran/ordersservice:${{ needs.build.outputs.short_sha }}
      - name: install yq
        uses: mikefarah/yq@v4.44.3
      - name: update ordersservice-pod.yml with docker tags
        run: |
          # short commit hash
          SHORT_SHA=${GITHUB_SHA::7}
          # update file yaml
          yd -i '.spec.containers[0].image = "hardingtrutran/ordersservice:'${SHORT_SHA}"'"'
      - name: commit deployment ordersservice file change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@noreply"
          git add k8s/ordersservice-pod.yml
          git commit -m "change tag sha"
          git push origin main

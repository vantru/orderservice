spring:
  application:
    name: ordersservice
  config:
    activate:
      on-profile:
      - development
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    # url: "jdbc:postgresql://host.docker.internal:5432/orderdb"
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      # optional:
      properties:
        hibernate:
          jdbc:
            time_zone: UTC
    show-sql: true

    properties:
      hibernate:
        format_sql: true
  
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8082
grpc:
  client:
    user-service:
      address: static://localhost:6565
      negotiationType: plaintext
axon:
  axonserver:
    enabled: true
    component-name: order-service
    servers: localhost:8124
